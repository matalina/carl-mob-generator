[build]
  # The app's version counts commits, so fetch the full history if Netlify cloned a shallow copy.
  command = "git fetch --unshallow --quiet || true; npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: send any unknown path to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
